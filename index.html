<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>刘正硕 · Resume Terminal</title>
  <meta name="description" content="刘正硕的交互式终端简历 —— 后端开发工程师 / AI 应用开发工程师 / 产品技术研发" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23002FA7'/><text x='16' y='70' font-family='monospace' font-size='46' font-weight='bold' fill='white'>&gt;_</text></svg>" />
  <!-- 字体：Inter（正文）+ JetBrains Mono（终端）。
       国内访问 Google Fonts 慢时可直接删掉下面三行，自动回退到系统字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ==================== 终端窗口 ==================== -->
  <div class="stage">
    <section class="terminal" aria-label="刘正硕的交互式简历终端">
      <!-- 窗口标题栏 -->
      <div class="term-bar no-print">
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="term-title">lzs@resume: ~/portfolio — zsh</div>
        <div class="term-actions">
          <button id="theme-toggle" class="tool-btn" type="button" title="切换深浅主题">theme</button>
          <button id="print-btn" class="tool-btn" type="button" title="打印 / 存为 PDF">print</button>
        </div>
      </div>

      <!-- 输出区 -->
      <div id="term-body" class="term-body" aria-live="polite"></div>

      <!-- 输入行（固定在底部） -->
      <div class="input-row no-print">
        <label class="prompt" for="term-input"><span class="p-user">lzs</span><span class="p-at">@</span><span class="p-host">resume</span><span class="p-sep">:</span><span class="p-path">~</span><span class="p-dollar">$</span></label>
        <input id="term-input" class="term-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="输入命令" placeholder="输入 help 查看命令…" />
      </div>

      <!-- 快捷命令（移动端友好，可点按） -->
      <div class="term-chips no-print" id="chips"></div>
    </section>
  </div>

  <!-- ==================== 打印版完整简历（由 js/main.js 从 data 渲染） ==================== -->
  <section id="print-resume" aria-label="打印版简历"></section>

  <noscript>
    <p style="max-width: 640px; margin: 40px auto; font-family: monospace;">
      这个简历是一个交互式终端，需要启用 JavaScript 才能运行。
    </p>
  </noscript>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
